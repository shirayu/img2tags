---
version: '3'

tasks:
  default:
    cmds:
      - task: format
      - task: lint_and_test

  lint_and_test:
    deps: [lint, test]

  format:
    deps: [format_python, format_md, format_toml]

  format_python:
    cmds:
      - ruff format --respect-gitignore
      - ruff check --fix

  format_md:
    cmds:
      - pnpm exec markdownlint-cli2 --fix

  format_toml:
    cmds:
      - taplo format *.toml

  lint:
    deps:
      [
        lint_yaml,
        lint_ruff_format,
        lint_ruff_check,
        lint_md,
        lint_pyright,
        lint_toml,
        lint_typos,
      ]

  lint_yaml:
    cmds:
      - >-
        find . \( -name node_modules -o -name .venv \) \
         -prune -o -type f \( -name "*.yaml" -o -name "*.yml" \) -print \
        | xargs yamllint

  lint_ruff_format:
    cmds:
      - ruff format --respect-gitignore --check

  lint_ruff_check:
    cmds:
      - ruff check --respect-gitignore

  lint_md:
    cmds:
      - pnpm exec markdownlint-cli2

  lint_pyright:
    cmds:
      - pnpm exec pyright

  lint_toml:
    cmds:
      - taplo format --check *.toml

  lint_typos:
    cmds:
      - typos -V && typos

  test:
    cmds:
      - ':'
